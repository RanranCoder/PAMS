services:
  mysql:
    image: mysql:8.0
    container_name: pams-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置（复制 .env.example 为 .env 并填写）}
      MYSQL_DATABASE: pams_db
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - pams-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - pams-net

  backend:
    build:
      context: ./pams-backend
    # PAMS_IMAGE_PREFIX 指向镜像仓库时，本地 build 出带仓库前缀的镜像，
    # 服务器则用 --no-build 直接从仓库拉取（见 deploy.sh）
    image: ${PAMS_IMAGE_PREFIX:-pams}-backend:${PAMS_IMAGE_TAG:-latest}
    container_name: pams-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pams_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      PAMS_JWT_SECRET: ${PAMS_JWT_SECRET}
      PAMS_UPLOAD_DIR: /app/uploads
      TZ: Asia/Shanghai
    volumes:
      - pams-uploads:/app/uploads
    networks:
      - pams-net

  web:
    build:
      context: ./pams-web
    image: ${PAMS_IMAGE_PREFIX:-pams}-web:${PAMS_IMAGE_TAG:-latest}
    container_name: pams-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - pams-net

volumes:
  pams-mysql-data:
  pams-uploads:

networks:
  pams-net:
    driver: bridge
